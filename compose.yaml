# Homelab Hub on any Docker host. No clone, no build:
#   1. save this file as compose.yaml
#   2. docker compose up -d
#   3. open http://<server>:8080  and edit the config on the page (gear menu -> Edit YAML)
# The config lives in ./data/services.yaml (created on the first start).
#
# TrueNAS: paste this file under Apps -> Discover Apps -> ⋮ -> Install via YAML and replace
# ./data with a dataset path (e.g. /mnt/tank/appdata/homelab-hub). More in DEPLOY.md.
services:
  homelab-hub:
    image: ghcr.io/simonholzer/homelab-hub:latest   # or a fixed version, e.g. :1.1.0
    # build: .                  # instead of `image:` to build from a clone of the repository
    restart: unless-stopped
    depends_on:
      - docker-proxy
    ports:
      - "8080:8080"
    volumes:
      - ./data:/config
      - /proc:/host/proc:ro     # server stats (CPU, memory, load, uptime)
      - /sys:/host/sys:ro       # CPU temperature, network cards
      # Free space per disk or pool (statfs only; the hub never reads files from these).
      # One line per storage tile in services.yaml (stats.disks):
      # - /mnt/tank:/pools/tank:ro
      # - /mnt/backup:/pools/backup:ro
    environment:
      DOCKER_HOST: http://docker-proxy:2375
      PROC_PATH: /host/proc
      SYS_PATH: /host/sys
      TZ: "Etc/UTC"                     # your time zone, e.g. Europe/Berlin
      # PUID: "1000"                    # the user the hub runs as and that owns ./data
      # PGID: "1000"
      # HUB_PASSWORD: "change-me"       # switch on the login (without it: no login at all)
      # HUB_PASSWORD_PROTECTS: "editor" # login only for the config editor; default "all" = the whole page
      # CONFIG_EDITOR: "off"            # no config editor on the page
      # ICON_DOWNLOAD: "off"            # never fetch missing icons from dashboard-icons

  # Read-only window onto Docker: only "list containers" is allowed (CONTAINERS=1).
  # Everything else (start/stop/exec/create ...) is refused by the proxy, so the hub
  # never gets the powers of the raw Docker socket.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
