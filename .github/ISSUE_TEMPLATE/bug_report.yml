name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please replace real addresses, domains and public IPs before posting, and never include passwords.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How does the hub run?
      options:
        - Docker (image from ghcr.io)
        - Docker (built myself)
        - TrueNAS app
        - Node.js without Docker
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or image tag
      placeholder: "latest, pulled on 2026-11-16 / v1.2.0 / commit abc1234"
  - type: input
    id: proxy
    attributes:
      label: What is in front of the hub?
      placeholder: "nothing / Cloudflare Tunnel + Access / Caddy / Traefik + Authelia ..."
  - type: textarea
    id: config
    attributes:
      label: Relevant part of the config
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Container log or browser console output
      render: text
