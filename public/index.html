<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Homelab Hub</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="title">
        <h1 id="title">Homelab Hub</h1>
        <p id="subtitle" class="sub"></p>
      </div>
      <div class="summary">
        <span id="summary" class="summary" aria-live="polite"></span>
        <button id="netmode" class="chip netmode" type="button" hidden></button>
        <button id="gear" class="gear" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings" title="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
      <div id="settings" class="settings" role="dialog" aria-label="Settings" hidden></div>
    </header>

    <div id="banner" class="banner" role="alert" hidden></div>

    <section id="stats" class="stats" aria-label="Server stats" hidden></section>

    <div class="toolbar">
      <input id="filter" type="search" placeholder="Filter services  ( press / )" autocomplete="off" aria-label="Filter services">
    </div>

    <main id="groups"></main>
    <p id="empty" class="empty" hidden>Nothing matches your filter.</p>

    <footer class="foot">
      <span id="updated"></span>
      <span class="sep">·</span>
      <a id="link-containers" href="/api/containers" target="_blank" rel="noopener">containers</a>
      <span class="sep">·</span>
      <a id="link-status" href="/api/status" target="_blank" rel="noopener">status JSON</a>
    </footer>
  </div>
  <!-- the config editor is only loaded when it is opened (gear menu); the addresses get their version here -->
  <script type="module" src="/app.js" data-editor-js="/editor.js" data-editor-css="/editor.css"></script>
</body>
</html>
