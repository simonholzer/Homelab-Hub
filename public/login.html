<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">
  <title>Homelab Hub</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#040506" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Homelab Hub">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="login">
    <form id="login" class="login-box" autocomplete="on">
      <img src="/favicon.svg" alt="" width="44" height="44">
      <h1>Homelab Hub</h1>
      <label for="password" id="label">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <p id="error" class="login-error" role="alert" hidden></p>
      <button id="submit" type="submit">Log in</button>
    </form>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
