# Homelab Hub: everything you can edit lives in this file.
# The page re-reads it every check cycle (about 30 s), no restart needed.
# If you make a mistake, the page keeps the last working version and shows what is wrong.
#
# You can also edit it on the page: gear menu (top right) -> Edit YAML.
# A full example with every option: config/services.yaml in the project
# (see the repository).

title: Homelab Hub
subtitle: ""

settings:
  checkIntervalSeconds: 30   # how often every service and container is checked (5 to 3600)
  statsIntervalSeconds: 5    # how often CPU, memory, load, network and storage are measured (1 to 3600)
  timeoutSeconds: 4          # a check that takes longer counts as offline (1 to 30)

# Address shortcuts. Use them as {server} in url:, local: and check: below.
hosts:
  server: 192.168.1.10       # <- the address of your server

# Storage tiles: one per folder mounted into the container (see compose.yaml).
# stats:
#   name: My server
#   disks:
#     - name: Data
#       path: /pools/data
#       size: 3.6T             # optional: gives "used / total" and a bar

groups:
  - name: Getting started
    services:
      # A first card so the page is not empty. Replace it with your own services.
      - name: Example
        url: https://example.com

      # A service on your server, reachable only at home:
      # - name: Jellyfin
      #   icon: jellyfin               # any icon name from https://github.com/homarr-labs/dashboard-icons
      #   local: http://{server}:8096
      #
      # A service that also has a public address:
      # - name: Photos
      #   icon: immich
      #   url: https://photos.example.com
      #   local: http://{server}:2283
      #   check: http://{server}:2283   # what decides the green/red dot
